[project]
name = "perio-voice-asr"
version = "0.2.0"
description = "Local low-latency speech recognition service for Perio Voice"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "faster-whisper>=1.2,<2",
  "numpy>=2.0,<3",
  "uvicorn[standard]>=0.35,<1",
  "vosk>=0.3.45,<0.4",
]

[project.optional-dependencies]
# CUDA 12 runtime libraries for GPU inference. CTranslate2 4.x loads cuBLAS and
# cuDNN 9 at decode time and does not ship them, so without these a CUDA device
# is detected but the first decode fails with "libcublas.so.12 is not found".
# Kept optional: they are over a gigabyte and CPU-only machines never need them.
gpu = [
  "nvidia-cublas-cu12>=12.4,<13",
  "nvidia-cudnn-cu12>=9.1,<10",
]

[dependency-groups]
dev = [
  "httpx2>=2.13,<3",
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.13,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests/server", "tests/evaluation"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["server", "scripts", "evaluation"]
ignore_missing_imports = true
warn_unused_ignores = false
