name: verify

# The full acceptance ledger is GATES.md. This workflow runs every gate that
# does not need the model artifact downloaded. The two that do — the non-mocked
# model smoke test and the acoustic replay harness — stay local, because pulling
# and caching a model in CI would make a slow job that proves less than running
# it on the machine the latency budget is written for.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - run: npm ci
      - run: npm run setup

      - name: Quality suite
        run: node scripts/verify-quality.mjs

      - name: Clinical evaluation
        run: node scripts/evaluate-clinical.mjs --gate

      - name: Capability gates
        run: |
          for gate in lexicon relevance disambiguation negation corrections \
                      sequence-guard workflow-state pipeline cadence \
                      telemetry intelligence-ui architecture documentation \
                      dental-evaluation; do
            echo "::group::$gate"
            node "scripts/verify-$gate.mjs"
            echo "::endgroup::"
          done
          node scripts/verify-fixture-capture.mjs --manifest

      # The live latency gate (G50) needs the GPU and the replay recordings; these
      # are the parts of the latency contract that can fail on any machine.
      - name: Latency contract gates
        run: |
          uv run python scripts/verify_fast_endpoint.py
          uv run python scripts/verify_latency_quality.py --unit
          node scripts/verify-transport-contract.mjs
          node scripts/verify-competitive-latency.mjs

      - name: Speaker gates
        run: |
          uv run python scripts/verify_enrollment.py
          uv run python scripts/verify_short_verification.py
          uv run python scripts/verify_speech_detection.py

      # The grammar gates need the 128 MB recognizer model, which npm run setup
      # fetches. Kept separate so a download failure is obvious in the log.
      - name: Recognizer gates
        run: |
          uv run python scripts/verify_grammar_lexicon.py
          uv run python scripts/verify_grammar_routing.py
          uv run python scripts/verify_no_forced_substitution.py
          uv run python scripts/verify_confusable_pairs.py
          uv run python scripts/verify_alternatives.py
          uv run python scripts/evaluate_recognizers.py --gate
